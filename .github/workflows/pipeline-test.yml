# Runs the pipeline stages built so far, or the golden-set model evaluation,
# on demand, using the repository secrets. Results are uploaded as a
# downloadable "runs" artifact. Step 9 turns this into the scheduled weekly run.
name: Pipeline test run

on:
  workflow_dispatch:
    inputs:
      task:
        description: "pipeline = run the stages; golden-eval = score candidate models on the golden set"
        required: false
        default: pipeline
      since:
        description: "First filing date, YYYY-MM-DD (blank = 7 days ago)"
        required: false
      until:
        description: "Last filing date, YYYY-MM-DD (blank = yesterday)"
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"  # show progress lines as they happen
      EDGAR_CONTACT_EMAIL: ${{ secrets.EDGAR_CONTACT_EMAIL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RUN_ID: test-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Golden-set model evaluation
        if: inputs.task == 'golden-eval'
        run: python -m pipeline.evaluate

      - name: 1 Pull
        if: inputs.task != 'golden-eval'
        run: |
          ARGS="--run-id $RUN_ID"
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          [ -n "${{ inputs.until }}" ] && ARGS="$ARGS --until ${{ inputs.until }}"
          python -m pipeline.pull $ARGS
      - name: 2 Parse
        if: inputs.task != 'golden-eval'
        run: python -m pipeline.parse --run-id $RUN_ID
      - name: 3 Filter
        if: inputs.task != 'golden-eval'
        run: python -m pipeline.filter --run-id $RUN_ID
      - name: 4 Enrich
        if: inputs.task != 'golden-eval'
        run: python -m pipeline.enrich --run-id $RUN_ID
      - name: 5-6 Classify + Verify
        if: inputs.task != 'golden-eval'
        run: python -m pipeline.classify --run-id $RUN_ID
      - name: 7 Output (data.json + summary; not committed in test runs)
        if: inputs.task != 'golden-eval'
        run: python -m pipeline.output --run-id $RUN_ID

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs
          path: runs/
