# Runs the pipeline stages built so far, on demand, using the repository
# secrets. Results are uploaded as a downloadable "runs" artifact.
# Step 9 turns this into the scheduled weekly run.
name: Pipeline test run

on:
  workflow_dispatch:
    inputs:
      since:
        description: "First filing date, YYYY-MM-DD (blank = 7 days ago)"
        required: false
      until:
        description: "Last filing date, YYYY-MM-DD (blank = yesterday)"
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDGAR_CONTACT_EMAIL: ${{ secrets.EDGAR_CONTACT_EMAIL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      RUN_ID: test-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 1 Pull
        run: |
          ARGS="--run-id $RUN_ID"
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          [ -n "${{ inputs.until }}" ] && ARGS="$ARGS --until ${{ inputs.until }}"
          python -m pipeline.pull $ARGS
      - name: 2 Parse
        run: python -m pipeline.parse --run-id $RUN_ID
      - name: 3 Filter
        run: python -m pipeline.filter --run-id $RUN_ID
      - name: 4 Enrich
        run: python -m pipeline.enrich --run-id $RUN_ID

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs
          path: runs/
