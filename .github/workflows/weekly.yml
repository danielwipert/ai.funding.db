# The weekly pipeline run: Mondays ~6am Central, on the prior 7 days of
# Form D filings. Commits dashboard/data.json, labels.jsonl (review
# decisions) and the run summary, then redeploys the dashboard.
# Run it by hand from the Actions tab with a "since" date for a backfill,
# or with "resume_run" to finish a failed run from its saved files (stages
# whose output file already exists are skipped, so nothing is paid twice).
name: Weekly pipeline

on:
  schedule:
    - cron: "17 12 * * 1"  # 12:17 UTC Monday = 6:17am CST / 7:17am CDT
  workflow_dispatch:
    inputs:
      since:
        description: "First filing date, YYYY-MM-DD (blank = 7 days ago). Use an older date for a backfill."
        required: false
      resume_run:
        description: "Run ID (number in the URL of a failed run) to continue from its saved files"
        required: false

permissions:
  actions: read  # to download a previous run's files when resuming
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # a 90-day backfill parses ~20,000 filings at the SEC rate limit
    env:
      PYTHONUNBUFFERED: "1"
      EDGAR_CONTACT_EMAIL: ${{ secrets.EDGAR_CONTACT_EMAIL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download the files of the run being resumed
        if: inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: run-files
          path: runs/
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}

      - name: Set run id
        run: |
          if [ -n "${{ inputs.resume_run }}" ]; then
            echo "RUN_ID=$(ls runs | head -1)" >> "$GITHUB_ENV"
          else
            echo "RUN_ID=$(date -u +%F)" >> "$GITHUB_ENV"
          fi
      - name: 1 Pull
        run: |
          [ -f "runs/$RUN_ID/01_filings.jsonl" ] && { echo "Already done, skipping"; exit 0; }
          ARGS="--run-id $RUN_ID"
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          python -m pipeline.pull $ARGS
      - name: 2 Parse
        run: '[ -f "runs/$RUN_ID/02_parsed.jsonl" ] && echo "Already done, skipping" || python -m pipeline.parse --run-id $RUN_ID'
      - name: 3 Filter
        run: '[ -f "runs/$RUN_ID/03_filtered.jsonl" ] && echo "Already done, skipping" || python -m pipeline.filter --run-id $RUN_ID'
      - name: 4 Enrich
        run: '[ -f "runs/$RUN_ID/04_enriched.jsonl" ] && echo "Already done, skipping" || python -m pipeline.enrich --run-id $RUN_ID'
      - name: 5-6 Classify + Verify
        run: '[ -f "runs/$RUN_ID/05_classified.jsonl" ] && echo "Already done, skipping" || python -m pipeline.classify --run-id $RUN_ID'
      - name: 7 Output
        run: python -m pipeline.output --run-id $RUN_ID

      - name: Commit results
        run: |
          git config user.name "ai-funding-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json labels.jsonl "runs/$RUN_ID/summary.json"
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          git commit -q -m "Weekly run $RUN_ID"
          git push origin HEAD:main && exit 0
          # main moved during the run (e.g. a "Mark contacted" save): redo the
          # output step on top of the latest main and try again.
          for attempt in 1 2 3 4; do
            sleep $((attempt * 5))
            git fetch -q origin main && git reset -q --hard origin/main
            python -m pipeline.output --run-id $RUN_ID
            git add dashboard/data.json labels.jsonl "runs/$RUN_ID/summary.json"
            git diff --cached --quiet && exit 0
            git commit -q -m "Weekly run $RUN_ID"
            git push origin HEAD:main && exit 0
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-files
          path: runs/

  deploy:
    needs: run
    uses: ./.github/workflows/pages.yml
